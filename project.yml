name: EasyControl
options:
  bundleIdPrefix: dev.hamroz
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  EasyControlCore:
    path: Packages/EasyControlCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  EasyControl:
    type: application
    platform: macOS
    sources:
      - path: App
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: EasyControl
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSCameraUsageDescription: EasyControl watches your hand through the camera to recognize gestures. Frames are processed on this Mac and are never stored or sent anywhere.
    entitlements:
      path: App/Resources/EasyControl.entitlements
      properties:
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hamroz.easycontrol
        ENABLE_HARDENED_RUNTIME: YES
        # One executable instead of a separate debug dylib, so a re-signed dev build stays loadable.
        ENABLE_DEBUG_DYLIB: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - package: EasyControlCore
        product: EasyControlCore
