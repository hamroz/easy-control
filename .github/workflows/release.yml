name: Release

# Push a tag like v0.2.0 to build the DMG and publish a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/.*CFBundleShortVersionString: "\(.*\)"/\1/p' project.yml)
          [[ "v$VERSION" == "$GITHUB_REF_NAME" ]] || { echo "Tag $GITHUB_REF_NAME != project.yml version v$VERSION"; exit 1; }
      - name: Build DMG
        run: scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EasyControl-dmg
          path: build/EasyControl-*.dmg*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/EasyControl-*.dmg build/EasyControl-*.dmg.sha256 \
            --title "EasyControl ${GITHUB_REF_NAME#v}" --generate-notes --notes-file .github/release-notes.md
